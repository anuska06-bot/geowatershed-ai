services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geowatershed_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: geowatershed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database_dump.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geowatershed"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
